<!DOCTYPE html>
<html>
<head>
    <title>User Management</title>
    <style>
        body {
        font-family: Arial, sans-serif;
        margin: 30px;
        }
        button {
        margin: 5px;
        padding: 10px 15px;
        cursor: pointer;
        }

        .section {
        margin-top: 20px;
        display: none;
        }

        input {
        padding: 8px;
        margin: 5px;
        }

        ul {
        margin-top: 10px;
        }
    </style>
</head>
<body>

<h1>User Management System</h1>

<div>
    <button onclick="showRegister()">Register User</button>
    <button onclick="showUsers()">Display All Users</button>
</div>

<!-- Register User Section -->
<div id="registerSection" class="section">
    <h2>Register User</h2>
    <input type="text" id="name" placeholder="Enter Name"><br>
    <input type="text" id="surname" placeholder="Enter Surname"><br>

    <label for="gender">Choose your gender:</label>

    <select name="genders" id="gender">
        <option value="female">Female</option>
        <option value="male">Male</option>
    </select><br>

    <input type="text" id="birthdate" placeholder="Enter your date of birth"><br>

    <label for="workAddress">Enter your work address</label><br>
    <textarea id="workAddress" maxlength="125"></textarea><br>

    <label for="homeAddress">Enter your home address</label><br>
    <textarea id="homeAddress" maxlength="125"></textarea><br>
    <button onclick="registerUser()">Save</button>
    <p id="message"></p>
</div>

<!-- Display Users Section -->
<div id="usersSection" class="section">
    <h2>All Users</h2>
    <ul id="userList"></ul>
</div>

<script>
    const users = [];

    function showRegister() {
    document.getElementById("registerSection").style.display = "block";
    document.getElementById("usersSection").style.display = "none";
    }

    function showUsers() {
        document.getElementById("registerSection").style.display = "none";
        document.getElementById("usersSection").style.display = "block";

        fetch('/homepage/display')
            .then(response => response.json())
            .then(users => {
                const userList = document.getElementById("userList");
                userList.innerHTML = "";

                if (users.length === 0) {
                    userList.innerHTML = "<li>No users registered.</li>";
                    return;
                }

                users.forEach(user => {
                    const li = document.createElement("li");
                    li.innerHTML = `
                        <strong>${user.name} ${user.surname}</strong><br>
                        Gender: ${user.gender}<br>
                        Birthdate: ${user.birthdate}<br>
                        Work Address: ${user.workAddress}<br>
                        Home Address: ${user.homeAddress}
                    `;
                    userList.appendChild(li);
                });
            })
            .catch(err => {
                document.getElementById("userList").innerHTML = "<li>Error loading users.</li>";
            });
    }

    function registerUser() {
    const name = document.getElementById("name").value.trim();
    const surname = document.getElementById("surname").value.trim();
    const gender = document.getElementById("gender").value.trim();
    const birthdate = document.getElementById("birthdate").value.trim();
    const workAddress = document.getElementById("workAddress").value.trim();
    const homeAddress = document.getElementById("homeAddress").value.trim();

    if (!name) {
    document.getElementById("message").textContent =
    "Please enter your name.";
    return;
    }

    if (!surname) {
    document.getElementById("message").textContent =
    "Please enter your surname.";
    return;
    }

    if (!gender) {
    document.getElementById("message").textContent =
    "Please enter your gender";
    return;
    }

    if (!birthdate) {
    document.getElementById("message").textContent =
    "Please enter your date of birth";
    return;
    }

    const user = {name, surname, gender, birthdate, workAddress, homeAddress};

    users.push({ name, surname, gender, birthdate, workAddress, homeAddress });

    fetch('/homepage/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(user)
    })
    .then(response => {
        if (response.ok) {
            document.getElementById("message").textContent = "User registered successfully.";
            document.getElementById("name").value = "";
            document.getElementById("surname").value = "";
            document.getElementById("gender").value = "";
            document.getElementById("birthdate").value = "";
            document.getElementById("workAddress").value = "";
            document.getElementById("homeAddress").value = "";
        } else {
            document.getElementById("message").textContent = "Registration failed.";
        }
    })
    .catch(err => {
        document.getElementById("message").textContent = "Error: " + err.message;
    });
    }
</script>

</body>
</html>
